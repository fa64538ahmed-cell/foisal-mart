<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foisal Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind Siliguri',sans-serif;background:#f5f5f0}
nav{background:#1a1a2e;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.logo{font-family:'Poppins',sans-serif;font-weight:900;font-size:1.4rem;color:#ff6b00}
.logo span{color:#ffd700}
.nav-links{display:flex;gap:4px}
.nb{background:none;border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-size:.9rem}
.nb:hover,.nb.active{background:#ff6b00}
.cb{background:#ff6b00;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-weight:700;display:flex;align-items:center;gap:6px}
.cc{background:#ffd700;color:#1a1a2e;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.page{display:none}.page.active{display:block}
.hero{background:#1a1a2e;min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center;padding:50px 20px;color:#fff}
.hero h1{font-family:'Poppins',sans-serif;font-size:2rem;font-weight:900}
.hero h1 span{color:#ffd700}
.hero p{color:#ccc;margin:12px 0 24px}
.hb{background:#ff6b00;color:#fff;border:none;padding:12px 30px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.sec{padding:24px 16px;max-width:1000px;margin:0 auto}
.sec h2{font-family:'Poppins',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);overflow:hidden}
.cimg{height:160px;background:#f0e6d3;display:flex;align-items:center;justify-content:center;font-size:3.5rem;position:relative;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;position:absolute}
.cbadge{position:absolute;top:8px;left:8px;background:#ff6b00;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:12px}
.cinfo{padding:12px}
.cname{font-weight:700;font-size:.95rem;margin-bottom:2px}
.ccat{color:#888;font-size:.8rem;margin-bottom:6px}
.cprice{color:#ff6b00;font-weight:800;font-size:1.1rem}
.coprice{color:#aaa;font-size:.8rem;text-decoration:line-through;margin-left:4px}
.cadd{width:100%;margin-top:10px;padding:9px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-weight:600}
.cadd:hover{background:#ff6b00}
.sc{padding:16px;max-width:1000px;margin:0 auto}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.si{flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:2px solid #e0e0e0;font-size:.95rem;font-family:'Hind Siliguri',sans-serif;outline:none}
.si:focus{border-color:#ff6b00}
.fb{padding:8px 16px;border-radius:8px;border:2px solid #e0e0e0;background:#fff;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-size:.9rem}
.fb:hover,.fb.active{background:#ff6b00;color:#fff;border-color:#ff6b00}
.cc2{max-width:650px;margin:0 auto;padding:24px 16px}
.ct{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:18px}
.ci{background:#fff;border-radius:12px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.cii{width:56px;height:56px;border-radius:8px;background:#f0e6d3;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;overflow:hidden}
.cii img{width:100%;height:100%;object-fit:cover}
.cin{flex:1}
.cip{color:#ff6b00;font-weight:700;font-size:.9rem}
.qc{display:flex;align-items:center;gap:8px;margin-top:4px}
.qb{width:28px;height:28px;border-radius:6px;border:none;background:#f0f0f0;cursor:pointer;font-weight:700}
.qb:hover{background:#ff6b00;color:#fff}
.rb{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.2rem}
.cs{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-top:8px}
.sr{display:flex;justify-content:space-between;padding:6px 0}
.sr.tot{font-weight:800;font-size:1.1rem;border-top:2px solid #f0f0f0;margin-top:6px;padding-top:10px}
.obtn{width:100%;padding:13px;background:#ff6b00;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;margin-top:12px}
.ec{text-align:center;padding:50px 0;color:#888}
.oc{max-width:560px;margin:0 auto;padding:24px 16px}
.of{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 16px rgba(0,0,0,.07)}
.of h2{font-family:'Poppins',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border-radius:8px;border:2px solid #e0e0e0;font-size:.95rem;font-family:'Hind Siliguri',sans-serif;outline:none}
.fg input:focus,.fg textarea:focus{border-color:#ff6b00}
.po{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
.popt{border:2px solid #e0e0e0;border-radius:8px;padding:10px;cursor:pointer;text-align:center;font-size:.85rem}
.popt.sel{border-color:#ff6b00;background:#fff5ee}
.pi{font-size:1.5rem;display:block;margin-bottom:2px}
.plb{width:100%;padding:13px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;margin-top:8px}
.sp{text-align:center;padding:60px 20px}
.sp .ico{font-size:4rem;margin-bottom:16px}
.sp h2{font-family:'Poppins',sans-serif;font-size:1.7rem;font-weight:800;color:#22c55e}
.sp p{color:#888;margin:10px 0 24px}
.ac{max-width:960px;margin:0 auto;padding:24px 16px}
.at{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:18px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.atb{padding:8px 18px;border-radius:8px;border:2px solid #e0e0e0;background:#fff;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-size:.9rem}
.atb.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.sc2{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07);text-align:center}
.sc2 .n{font-family:'Poppins',sans-serif;font-size:1.8rem;font-weight:800;color:#ff6b00}
.sc2 .l{color:#888;font-size:.85rem;margin-top:3px}
.tw{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{background:#1a1a2e;color:#fff;padding:11px 14px;text-align:left;font-size:.88rem}
td{padding:10px 14px;border-bottom:1px solid #f5f5f5;font-size:.9rem}
tr:hover td{background:#fff8f2}
.sb2{padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700}
.sp2{background:#fef9c3;color:#854d0e}
.sd{background:#dcfce7;color:#166534}
.sc3{background:#fee2e2;color:#991b1b}
.af{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.af h3{font-family:'Poppins',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:14px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ip{width:100%;height:140px;border-radius:8px;border:2px dashed #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden;margin-top:6px;background:#f9f9f9}
.ip img{width:100%;height:100%;object-fit:cover}
.cs4{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:14px}
.cs4 h3{font-family:'Poppins',sans-serif;font-weight:700;font-size:1rem;margin-bottom:12px;border-bottom:2px solid #f5f5f0;padding-bottom:8px}
.cr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cr label{flex:1;font-weight:600;font-size:.9rem}
.cr input[type=color]{width:44px;height:32px;border:none;border-radius:6px;cursor:pointer}
.sv{padding:10px 24px;background:#ff6b00;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:10px;font-size:.95rem;font-weight:600;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
@media(max-width:560px){.hero h1{font-size:1.5rem}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.fr{grid-template-columns:1fr}.po{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav>
  <div class="logo" id="navLogo">Foisal<span>Mart</span></div>
  <div class="nav-links">
    <button class="nb active" id="btn-home" onclick="go('home')">🏠 হোম</button>
    <button class="nb" id="btn-shop" onclick="go('shop')">🛍️ শপ</button>
    <button class="nb" id="btn-admin" onclick="go('admin')">⚙️ অ্যাডমিন</button>
  </div>
  <button class="cb" onclick="go('cart')">🛒 কার্ট <span class="cc" id="cc">0</span></button>
</nav>

<div class="page active" id="pg-home">
  <div class="hero" id="heroDiv">
    <div>
      <h1 id="heroH">স্বাগতম <span id="heroS">Foisal Mart</span> এ!</h1>
      <p id="heroP">সেরা প্রোডাক্ট, সেরা দামে — দ্রুত ডেলিভারি নিশ্চিত</p>
      <button class="hb" onclick="go('shop')">এখনই কিনুন →</button>
    </div>
  </div>
  <div class="sec">
    <h2>ফিচার্ড প্রোডাক্ট</h2>
    <div class="grid" id="fg"></div>
  </div>
</div>

<div class="page" id="pg-shop">
  <div class="sc">
    <div class="sb">
      <input class="si" type="text" placeholder="🔍 প্রোডাক্ট খুঁজুন..." id="si" oninput="fp()">
      <button class="fb active" onclick="fc('সব')">সব</button>
      <button class="fb" onclick="fc('ইলেকট্রনিক্স')">ইলেকট্রনিক্স</button>
      <button class="fb" onclick="fc('পোশাক')">পোশাক</button>
      <button class="fb" onclick="fc('খাবার')">খাবার</button>
      <button class="fb" onclick="fc('গৃহস্থালি')">গৃহস্থালি</button>
      <button class="fb" onclick="fc('অন্যান্য')">অন্যান্য</button>
    </div>
    <div class="grid" id="sg"></div>
  </div>
</div>

<div class="page" id="pg-cart">
  <div class="cc2">
    <div class="ct">🛒 আমার কার্ট</div>
    <div id="ci"></div>
    <div id="cs"></div>
  </div>
</div>

<div class="page" id="pg-order">
  <div class="oc">
    <div class="of">
      <h2>📦 অর্ডার করুন</h2>
      <div class="fg"><label>নাম</label><input type="text" id="cn" placeholder="পুরো নাম"></div>
      <div class="fg"><label>মোবাইল</label><input type="tel" id="cp" placeholder="01XXXXXXXXX"></div>
      <div class="fg"><label>ঠিকানা</label><textarea id="ca" rows="2" placeholder="বাড়ি/রোড/এলাকা"></textarea></div>
      <div class="fg"><label>পেমেন্ট</label>
        <div class="po">
          <div class="popt sel" onclick="sp2(this,'bkash')"><span class="pi">📱</span>bKash</div>
          <div class="popt" onclick="sp2(this,'nagad')"><span class="pi">💳</span>Nagad</div>
          <div class="popt" onclick="sp2(this,'rocket')"><span class="pi">🚀</span>Rocket</div>
          <div class="popt" onclick="sp2(this,'cod')"><span class="pi">💵</span>ক্যাশ</div>
        </div>
      </div>
      <div id="os" style="background:#f5f5f0;border-radius:8px;padding:12px;margin:12px 0;font-size:.9rem"></div>
      <button class="plb" onclick="po2()">✅ অর্ডার কনফার্ম করুন</button>
    </div>
  </div>
</div>

<div class="page" id="pg-success">
  <div class="sp">
    <div class="ico">🎉</div>
    <h2>অর্ডার সফল!</h2>
    <p>আপনার অর্ডার পেয়েছি। শীঘ্রই ডেলিভারি দেওয়া হবে।</p>
    <button class="hb" onclick="go('shop')">আরও কিনুন →</button>
  </div>
</div>

<div class="page" id="pg-admin">
  <div class="ac">
    <div class="at">⚙️ অ্যাডমিন প্যানেল</div>
    <div class="atabs">
      <button class="atb active" onclick="at2('dash',this)">📊 ড্যাশবোর্ড</button>
      <button class="atb" onclick="at2('orders',this)">📦 অর্ডার</button>
      <button class="atb" onclick="at2('prods',this)">🛍️ প্রোডাক্ট</button>
      <button class="atb" onclick="at2('add',this)">➕ নতুন প্রোডাক্ট</button>
      <button class="atb" onclick="at2('cust',this)">🎨 কাস্টমাইজ</button>
    </div>
    <div id="ad-dash"></div>
    <div id="ad-orders" style="display:none"></div>
    <div id="ad-prods" style="display:none"></div>
    <div id="ad-add" style="display:none"></div>
    <div id="ad-cust" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ST={n1:'Foisal',n2:'Mart',sub:'সেরা প্রোডাক্ট, সেরা দামে',bg:'',pc:'#ff6b00',sc:'#1a1a2e',ac:'#ffd700'};
var PD=[
  {id:1,name:'স্মার্টফোন X12',cat:'ইলেকট্রনিক্স',price:18500,op:22000,em:'📱',img:'',badge:'হট'},
  {id:2,name:'হেডফোন',cat:'ইলেকট্রনিক্স',price:2500,op:3500,em:'🎧',img:'',badge:'ডিসকাউন্ট'},
  {id:3,name:'পাঞ্জাবি',cat:'পোশাক',price:1200,op:1800,em:'👘',img:'',badge:'নতুন'},
  {id:4,name:'বিরিয়ানি মিক্স',cat:'খাবার',price:320,op:400,em:'🍛',img:'',badge:'সেরা'}
];
var CT=[],OR=[],PM='bkash',CUR='সব',EI=-1;

function apST(){
  document.title=ST.n1+' '+ST.n2;
  document.getElementById('navLogo').innerHTML=ST.n1+'<span>'+ST.n2+'</span>';
  document.getElementById('navLogo').style.color=ST.pc;
  document.getElementById('heroS').textContent=ST.n1+' '+ST.n2;
  document.getElementById('heroP').textContent=ST.sub;
  document.getElementById('heroDiv').style.background=ST.bg?'url('+ST.bg+') center/cover':'#1a1a2e';
}

function go(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
  document.getElementById('pg-'+p).classList.add('active');
  ['home','shop','admin'].forEach(function(n){
    var b=document.getElementById('btn-'+n);
    if(b)b.classList.remove('active');
  });
  var ab=document.getElementById('btn-'+p);
  if(ab)ab.classList.add('active');
  if(p==='home')rfg();
  if(p==='shop')fp();
  if(p==='cart')rc();
  if(p==='order')ros();
  if(p==='admin')rd();
}

function mkCard(p){
  var im=p.img?'<img src="'+p.img+'" style="position:absolute;width:100%;height:100%;object-fit:cover">':'';
  return '<div class="card">'
    +'<div class="cimg">'+im+'<span style="position:relative">'+p.em+'</span>'+(p.badge?'<div class="cbadge">'+p.badge+'</div>':'')+'</div>'
    +'<div class="cinfo"><div class="cname">'+p.name+'</div><div class="ccat">'+p.cat+'</div>'
    +'<div class="cprice">৳'+p.price.toLocaleString()+(p.op>p.price?'<span class="coprice">৳'+p.op.toLocaleString()+'</span>':'')+'</div>'
    +'<button class="cadd" onclick="ac2('+p.id+')">🛒 কার্টে যোগ করুন</button></div></div>';
}

function rfg(){document.getElementById('fg').innerHTML=PD.slice(0,4).map(mkCard).join('');}
function fp(){
  var q=document.getElementById('si').value.toLowerCase();
  var f=PD.filter(function(p){return(CUR==='সব'||p.cat===CUR)&&p.name.toLowerCase().indexOf(q)>-1});
  document.getElementById('sg').innerHTML=f.length?f.map(mkCard).join(''):'<p style="text-align:center;padding:30px;color:#999;grid-column:1/-1">কোনো প্রোডাক্ট নেই</p>';
}
function fc(c){CUR=c;document.querySelectorAll('.fb').forEach(function(b){b.classList.toggle('active',b.textContent.trim()===c)});fp();}

function ac2(id){
  var p=PD.find(function(x){return x.id===id}),ex=CT.find(function(x){return x.id===id});
  if(ex)ex.qty++;else CT.push(Object.assign({},p,{qty:1}));
  ucc();toast('✅ "'+p.name+'" কার্টে যোগ হয়েছে!');
}
function ucc(){document.getElementById('cc').textContent=CT.reduce(function(s,i){return s+i.qty},0);}
function rc(){
  var ci=document.getElementById('ci'),cs=document.getElementById('cs');
  if(!CT.length){ci.innerHTML='<div class="ec"><div style="font-size:3rem">🛒</div><p>কার্ট খালি</p><br><button class="hb" onclick="go(\'shop\')">শপিং শুরু করুন</button></div>';cs.innerHTML='';return;}
  ci.innerHTML=CT.map(function(i){
    return '<div class="ci"><div class="cii">'+(i.img?'<img src="'+i.img+'">':(i.em||'📦'))+'</div>'
    +'<div class="cin"><div style="font-weight:700">'+i.name+'</div><div class="cip">৳'+i.price.toLocaleString()+' × '+i.qty+' = ৳'+(i.price*i.qty).toLocaleString()+'</div>'
    +'<div class="qc"><button class="qb" onclick="cq('+i.id+',-1)">−</button><span>'+i.qty+'</span><button class="qb" onclick="cq('+i.id+',1)">+</button></div></div>'
    +'<button class="rb" onclick="rc2('+i.id+')">🗑️</button></div>';
  }).join('');
  var t=CT.reduce(function(s,i){return s+i.price*i.qty},0);
  cs.innerHTML='<div class="cs"><div class="sr"><span>সাবটোটাল</span><span>৳'+t.toLocaleString()+'</span></div>'
    +'<div class="sr"><span>ডেলিভারি</span><span>৳60</span></div>'
    +'<div class="sr tot"><span>মোট</span><span>৳'+(t+60).toLocaleString()+'</span></div>'
    +'<button class="obtn" onclick="go(\'order\')">🛍️ অর্ডার করুন</button></div>';
}
function cq(id,d){var i=CT.find(function(x){return x.id===id});if(!i)return;i.qty+=d;if(i.qty<=0)CT=CT.filter(function(x){return x.id!==id});ucc();rc();}
function rc2(id){CT=CT.filter(function(x){return x.id!==id});ucc();rc();}
function ros(){
  var t=CT.reduce(function(s,i){return s+i.price*i.qty},0);
  document.getElementById('os').innerHTML='<strong>অর্ডার সারসংক্ষেপ:</strong><br>'
    +CT.map(function(i){return(i.em||'')+''+i.name+' ×'+i.qty+' = ৳'+(i.price*i.qty).toLocaleString()}).join('<br>')
    +'<br><strong>মোট: ৳'+(t+60).toLocaleString()+'</strong>';
}
function sp2(el,m){document.querySelectorAll('.popt').forEach(function(o){o.classList.remove('sel')});el.classList.add('sel');PM=m;}
function po2(){
  var n=document.getElementById('cn').value.trim(),ph=document.getElementById('cp').value.trim(),ad=document.getElementById('ca').value.trim();
  if(!n||!ph||!ad){toast('❗ সব তথ্য পূরণ করুন');return;}
  if(!CT.length){toast('❗ কার্ট খালি');return;}
  var t=CT.reduce(function(s,i){return s+i.price*i.qty},0)+60;
  OR.push({id:'ORD'+Date.now(),name:n,phone:ph,address:ad,pay:PM,items:CT.slice(),total:t,status:'pending',date:new Date().toLocaleDateString()});
  CT=[];ucc();go('success');
}

function at2(tab,btn){
  ['dash','orders','prods','add','cust'].forEach(function(t){document.getElementById('ad-'+t).style.display=t===tab?'block':'none'});
  document.querySelectorAll('.atb').forEach(function(b){b.classList.remove('active')});
  if(btn)btn.classList.add('active');
  if(tab==='dash')rd();
  if(tab==='orders')ro();
  if(tab==='prods')rp();
  if(tab==='add')ra();
  if(tab==='cust')rcu();
}

function rd(){
  var ts=OR.reduce(function(s,o){return s+o.total},0);
  document.getElementById('ad-dash').innerHTML='<div class="sg"><div class="sc2"><div class="n">'+OR.length+'</div><div class="l">মোট অর্ডার</div></div>'
    +'<div class="sc2"><div class="n">৳'+ts.toLocaleString()+'</div><div class="l">মোট বিক্রয়</div></div>'
    +'<div class="sc2"><div class="n">'+PD.length+'</div><div class="l">প্রোডাক্ট</div></div>'
    +'<div class="sc2"><div class="n">'+OR.filter(function(o){return o.status==='pending'}).length+'</div><div class="l">পেন্ডিং</div></div></div>';
}

function ro(){
  var el=document.getElementById('ad-orders');
  if(!OR.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#999">কোনো অর্ডার নেই</div>';return;}
  el.innerHTML='<div class="tw"><table><thead><tr><th>ID</th><th>নাম</th><th>মোবাইল</th><th>মোট</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody>'
    +OR.map(function(o,i){return'<tr><td>'+o.id.slice(-5)+'</td><td>'+o.name+'</td><td>'+o.phone+'</td><td>৳'+o.total.toLocaleString()+'</td>'
    +'<td><span class="sb2 '+(o.status==='pending'?'sp2':o.status==='delivered'?'sd':'sc3')+'">'+(o.status==='pending'?'পেন্ডিং':o.status==='delivered'?'ডেলিভারড':'বাতিল')+'</span></td>'
    +'<td><button onclick="uo('+i+',\'delivered\')" style="background:#22c55e;color:#fff;border:none;padding:4px 8px;border-radius:5px;cursor:pointer;margin-right:4px">✅</button>'
    +'<button onclick="uo('+i+',\'cancelled\')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:5px;cursor:pointer">❌</button></td></tr>';}).join('')
    +'</tbody></table></div>';
}
function uo(i,s){OR[i].status=s;ro();toast('✅ স্ট্যাটাস আপডেট');}

function rp(){
  document.getElementById('ad-prods').innerHTML='<div class="tw"><table><thead><tr><th>ছবি</th><th>নাম</th><th>ক্যাটাগরি</th><th>দাম</th><th>অ্যাকশন</th></tr></thead><tbody>'
    +PD.map(function(p,i){return'<tr><td>'+(p.img?'<img src="'+p.img+'" style="width:36px;height:36px;border-radius:6px;object-fit:cover">':p.em)+'</td>'
    +'<td>'+p.name+'</td><td>'+p.cat+'</td><td>৳'+p.price.toLocaleString()+'</td>'
    +'<td><button onclick="ep('+i+')" style="background:#ff6b00;color:#fff;border:none;padding:4px 8px;border-radius:5px;cursor:pointer;margin-right:4px">✏️</button>'
    +'<button onclick="dp('+i+')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:5px;cursor:pointer">🗑️</button></td></tr>';}).join('')
    +'</tbody></table></div>';
}
function dp(i){if(confirm('মুছবেন?')){PD.splice(i,1);rp();toast('🗑️ মুছে ফেলা হয়েছে');}}
function ep(i){
  EI=i;at2('add',null);document.querySelectorAll('.atb').forEach(function(b){b.classList.remove('active')});
  setTimeout(function(){
    var p=PD[i];
    document.getElementById('nn').value=p.name;
    document.getElementById('nc').value=p.cat;
    document.getElementById('np').value=p.price;
    document.getElementById('nop').value=p.op;
    document.getElementById('ne').value=p.em;
    document.getElementById('nb2').value=p.badge;
    document.getElementById('ni').value=p.img;
    upv();
    document.getElementById('spb').textContent='✅ আপডেট করুন';
  },100);
}

function ra(){
  EI=-1;
  document.getElementById('ad-add').innerHTML='<div class="af"><h3>➕ নতুন প্রোডাক্ট যোগ করুন</h3>'
    +'<div class="fr"><div class="fg"><label>নাম</label><input type="text" id="nn" placeholder="প্রোডাক্টের নাম" oninput="upv()"></div>'
    +'<div class="fg"><label>ক্যাটাগরি</label><select id="nc"><option>ইলেকট্রনিক্স</option><option>পোশাক</option><option>খাবার</option><option>গৃহস্থালি</option><option>অন্যান্য</option></select></div></div>'
    +'<div class="fr"><div class="fg"><label>দাম (৳)</label><input type="number" id="np" placeholder="0"></div>'
    +'<div class="fg"><label>আগের দাম (৳)</label><input type="number" id="nop" placeholder="0"></div></div>'
    +'<div class="fr"><div class="fg"><label>ইমোজি</label><input type="text" id="ne" placeholder="📦" maxlength="2" oninput="upv()"></div>'
    +'<div class="fg"><label>ব্যাজ</label><input type="text" id="nb2" placeholder="নতুন/হট/সেরা"></div></div>'
    +'<div class="fg"><label>📸 ছবির URL (ঐচ্ছিক)</label><input type="text" id="ni" placeholder="https://example.com/img.jpg" oninput="upv()"><div class="ip" id="ipv"><span style="font-size:2.5rem">📦</span></div></div>'
    +'<button class="sv" id="spb" onclick="svp()">➕ প্রোডাক্ট যোগ করুন</button></div>';
}

function upv(){
  var img=document.getElementById('ni').value,em=document.getElementById('ne').value||'📦';
  var d=document.getElementById('ipv');
  d.innerHTML=img?'<img src="'+img+'" style="width:100%;height:100%;object-fit:cover">':'<span style="font-size:2.5rem">'+em+'</span>';
}

function svp(){
  var nm=document.getElementById('nn').value.trim(),cat=document.getElementById('nc').value;
  var pr=parseInt(document.getElementById('np').value),op=parseInt(document.getElementById('nop').value)||parseInt(document.getElementById('np').value);
  var em=document.getElementById('ne').value||'📦',badge=document.getElementById('nb2').value,img=document.getElementById('ni').value.trim();
  if(!nm||!pr){toast('❗ নাম ও দাম দিন');return;}
  if(EI>=0){PD[EI]=Object.assign(PD[EI],{name:nm,cat:cat,price:pr,op:op,em:em,badge:badge,img:img});toast('✅ আপডেট হয়েছে!');EI=-1;}
  else{PD.push({id:Date.now(),name:nm,cat:cat,price:pr,op:op,em:em,img:img,badge:badge});toast('✅ প্রোডাক্ট যোগ হয়েছে!');}
  ra();
}

function rcu(){
  document.getElementById('ad-cust').innerHTML='<div class="cs4"><h3>🏪 শপের নাম</h3>'
    +'<div class="fr"><div class="fg"><label>প্রথম অংশ</label><input type="text" id="c1" value="'+ST.n1+'"></div>'
    +'<div class="fg"><label>দ্বিতীয় অংশ</label><input type="text" id="c2" value="'+ST.n2+'"></div></div></div>'
    +'<div class="cs4"><h3>🖼️ ব্যানার</h3>'
    +'<div class="fg"><label>সাবটাইটেল</label><input type="text" id="csub" value="'+ST.sub+'"></div>'
    +'<div class="fg"><label>ব্যানার ছবির URL</label><input type="text" id="cbg" value="'+ST.bg+'" placeholder="https://example.com/banner.jpg"></div></div>'
    +'<div class="cs4"><h3>🎨 রং</h3>'
    +'<div class="cr"><label>প্রাইমারি রং</label><input type="color" id="cp2" value="'+ST.pc+'"></div>'
    +'<div class="cr"><label>নেভবার রং</label><input type="color" id="cs2" value="'+ST.sc+'"></div>'
    +'<div class="cr"><label>একসেন্ট রং</label><input type="color" id="ca2" value="'+ST.ac+'"></div></div>'
    +'<button class="sv" onclick="scu()">💾 সেভ করুন</button>';
}

function scu(){
  ST.n1=document.getElementById('c1').value;
  ST.n2=document.getElementById('c2').value;
  ST.sub=document.getElementById('csub').value;
  ST.bg=document.getElementById('cbg').value;
  ST.pc=document.getElementById('cp2').value;
  ST.sc=document.getElementById('cs2').value;
  ST.ac=document.getElementById('ca2').value;
  apST();toast('✅ সেটিংস সেভ হয়েছে!');
}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500);}

apST();rfg();ra();
</script>
</body>
</html>
